# Params for path_obstacle_monitor_node - collision stop gate. It stops the
# vehicle for ANY obstacle (static or moving LiDAR points, or camera fusion)
# inside a straight corridor ahead of the vehicle at the buggy footprint
# width. See the node's header comment for the full mechanism.

path_obstacle_monitor:
  ros__parameters:
    use_sim_time: true

    fixed_frame: odom
    vehicle_frame: base_link

    moving_points_topic: /moving_obstacle_points
    static_points_topic: /static_obstacle_points
    camera_red_topic: /camera_red_detected

    # Corridor ahead of the vehicle. Length is the distance checked; it
    # must exceed the braking distance at the commanded speed (about 1 m/s
    # at 4 km/h) plus sensor and actuation latency.
    # Half-width matches the buggy footprint: vehicle_half_width (1.0) +
    # vehicle_footprint_margin (0.3) = 1.3 m.
    zone_start_offset_m: 0.0
    ahead_zone_length_m: 5.0
    ahead_zone_half_width_m: 1.3

    # Consecutive ARRIVED LiDAR messages that must each show an in-zone
    # point before the stop is set (guards against single noisy frames).
    lidar_set_debounce_messages: 2

    # A camera_red_detected=true older than this is ignored.
    camera_timeout_sec: 1.0

    # Clear cycles required before releasing a stop.
    clear_debounce_cycles: 5

    process_rate_hz: 10.0
