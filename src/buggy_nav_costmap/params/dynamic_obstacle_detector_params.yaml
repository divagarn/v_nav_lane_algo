# Params for dynamic_obstacle_detector_node - moving/static obstacle
# classification. A cell's density-ratio across the last `history_length`
# merged scans decides whether it's NEW this cycle; per-object tracking
# then decides whether it STAYS excluded from /static_obstacle_points -
# see that node's own header comment for the full mechanism, in
# particular why a tracked object is excluded for as long as it's
# physically there, not just while it still looks "new" by density alone.
# /static_obstacle_points feeds costmap_lane_planner (path SELECTION) when
# path_obstacle_monitor_node is in the loop - path selection therefore
# never reacts to any obstacle that appeared after the vehicle started
# navigating, moving or not. /moving_obstacle_points still reaches
# path_obstacle_monitor_node's stop gate either way.

dynamic_obstacle_detector:
  ros__parameters:
    use_sim_time: true
    fixed_frame: odom
    base_frame: base_link

    # Same input costmap_lane_planner uses - already ground-removed
    # (segment_ground) + self-hit-filtered upstream.
    obstacle_topic: /non_ground_points_filtered

    cell_size: 0.3
    # Number of past scans (including the current one) merged for the
    # density comparison - matches the paper's own tuned value. More
    # history = more confident static rejection (a real static object
    # gets more corroborating scans before its cells drop out of the
    # moving output) but doesn't slow down recognizing a moving object as
    # such (that classification is immediate - see the node's header
    # comment for why this differs from a running-average/EMA design).
    history_length: 6
    # Only points within this radius of the vehicle's current position are
    # processed each cycle - same bounded-working-set reasoning as
    # costmap_lane_planner's own obstacle_search_radius.
    obstacle_search_radius: 30.0

    # static_score = (points in a cell across ALL buffered scans) /
    # (points in that cell THIS scan x number of buffered scans) - ranges
    # from ~1/history_length (only the current scan ever touched this
    # cell - moving) up to 1.0 (every buffered scan corroborates it -
    # static). A cell is only ever included in the output cloud when its
    # static_score <= moving_threshold; everything else (confidently
    # static, or too ambiguous/newly-seen to call yet) is simply omitted.
    moving_threshold: 0.3

    # Moving cells are grouped into contiguous (8-connected) blobs and any
    # blob with fewer than this many TOTAL raw points is dropped before
    # publishing. This is the actual filter against false "moving" walls:
    # confirmed live that search-radius-boundary flicker and other
    # newly-seen-static artifacts are thin, few-point slivers, while a
    # real moving object (person, vehicle) is a solid blob spanning many
    # points - raise this if walls are still slipping through, lower it
    # if a real but small/distant moving object is being filtered out.
    min_moving_blob_points: 15

    # A blob's bounding-box longest side must NOT exceed this (meters) to
    # be published. Confirmed live that during CONTINUOUS forward driving
    # (not just startup/stationary jitter), a wall segment newly revealed
    # by the vehicle driving far enough to see around whatever was
    # occluding it also reads as under-corroborated - coverage_count only
    # models search-radius distance, not actual line-of-sight/occlusion -
    # and such blobs are large (100s of points) AND spatially elongated,
    # unlike a compact real object (person, vehicle). Lower this if walls
    # are still slipping through; raise it if a real wide/long moving
    # obstacle (e.g. a long vehicle passing close and lengthwise) is
    # being filtered out.
    max_moving_blob_extent_m: 2.5

    # Flat RGB tint (0-255 each) applied to every published moving point -
    # not intensity-mapped, so it reads as visually distinct in RViz
    # (PointCloud2 display, Color Transformer: RGB8) regardless of
    # whatever intensity data the original sensor points carried.
    moving_color_r: 0
    moving_color_g: 0
    moving_color_b: 255

    process_rate_hz: 10.0

    # Per-object tracking - see this node's own "TRACKING" header comment
    # for the full mechanism. Decides the /moving_obstacle_points vs
    # /static_obstacle_points split (a tracked object stays excluded from
    # static for as long as it's physically there, not just while it still
    # looks "new" by density ratio) AND drives /moving_object_tracking
    # (velocity arrow + speed label + predicted-trajectory line per
    # CONFIRMED tracked object, Autoware-style).
    #
    # Dual role: (1) the search radius used to re-detect an existing track
    # by proximity to its own last position in the full current cloud,
    # each cycle, regardless of density classification - this is what
    # keeps a stationary obstacle permanently excluded instead of it
    # graduating back to static after history_length cycles. (2) a
    # detected new-blob centroid beyond this of every track's last
    # position is treated as a different object, not the same one having
    # jumped. Walking-pedestrian/vehicle speeds at this process_rate_hz
    # move well under this per cycle.
    max_track_jump_m: 2.0
    # How many current-cycle points within max_track_jump_m of a track's
    # last position count as a re-detection (not just stray/noise points
    # at the search radius's edge). Lower than min_moving_blob_points
    # deliberately - this only confirms "still substantially there".
    track_redetect_min_points: 5
    # Consecutive cycles re-detection can find nothing nearby before a
    # track is dropped - this is what actually ends the exclusion, once
    # the object is confirmed gone.
    max_missed_cycles: 5
    # How far ahead (seconds) the predicted-trajectory line extends.
    prediction_horizon_sec: 2.0

    # CONFIRMATION - vehicles/pedestrians only, not shaking tree leaves,
    # wind-blown debris, or sensor jitter - but VISUALIZATION ONLY
    # (/moving_object_tracking draws confirmed tracks only). Does NOT gate
    # /moving_obstacle_points vs /static_obstacle_points: that split stays
    # on the broader, pre-confirmation "new and compact" test on purpose -
    # costmap_lane_planner only ever reads /static_obstacle_points for
    # lane SELECTION, so a brand-new obstacle (moving or not yet proven
    # moving) must never land there, or it could change which lane gets
    # picked. The vehicle keeps driving its already-chosen lane for ANY
    # new obstacle; only path_obstacle_monitor's ahead-zone gate (which
    # already checks both topics) may stop it once it's actually in the
    # way. A track only counts as confirmed once matched for
    # min_confirm_cycles consecutive cycles AND its straight-line distance
    # from where it was FIRST seen exceeds min_confirm_displacement_m -
    # sustained net displacement is what actually separates a translating
    # object from in-place jitter, which never accumulates distance no
    # matter how long it keeps triggering the density check. Defaults
    # confirm a walking pedestrian (~1 m/s) in well under half a second.
    min_confirm_cycles: 3
    min_confirm_displacement_m: 0.3
