# Params for dynamic_obstacle_detector_node - moving-obstacle
# classification ported from the core idea of Asvadi et al. (RAS 2016):
# compare each occupied cell's point density across the last
# `history_length` merged scans against what just the current scan alone
# contributed there. See that node's own header comment for the full
# mechanism and why it needs no per-object clustering/tracking at all.
# Purely a perception/visualization node: publishes ONLY the moving points
# (as a colour-tinted 3D point cloud, full sensor resolution) on
# /moving_obstacle_points - static points are not published at all, and
# this does not feed costmap_lane_planner or any planner.

dynamic_obstacle_detector:
  ros__parameters:
    use_sim_time: true
    fixed_frame: odom
    base_frame: base_link

    # Same input costmap_lane_planner uses - already ground-removed
    # (segment_ground) + self-hit-filtered upstream.
    obstacle_topic: /non_ground_points_filtered

    cell_size: 0.3
    # Number of past scans (including the current one) merged for the
    # density comparison - matches the paper's own tuned value. More
    # history = more confident static rejection (a real static object
    # gets more corroborating scans before its cells drop out of the
    # moving output) but doesn't slow down recognizing a moving object as
    # such (that classification is immediate - see the node's header
    # comment for why this differs from a running-average/EMA design).
    history_length: 6
    # Only points within this radius of the vehicle's current position are
    # processed each cycle - same bounded-working-set reasoning as
    # costmap_lane_planner's own obstacle_search_radius.
    obstacle_search_radius: 30.0

    # static_score = (points in a cell across ALL buffered scans) /
    # (points in that cell THIS scan x number of buffered scans) - ranges
    # from ~1/history_length (only the current scan ever touched this
    # cell - moving) up to 1.0 (every buffered scan corroborates it -
    # static). A cell is only ever included in the output cloud when its
    # static_score <= moving_threshold; everything else (confidently
    # static, or too ambiguous/newly-seen to call yet) is simply omitted.
    moving_threshold: 0.3

    # Moving cells are grouped into contiguous (8-connected) blobs and any
    # blob with fewer than this many TOTAL raw points is dropped before
    # publishing. This is the actual filter against false "moving" walls:
    # confirmed live that search-radius-boundary flicker and other
    # newly-seen-static artifacts are thin, few-point slivers, while a
    # real moving object (person, vehicle) is a solid blob spanning many
    # points - raise this if walls are still slipping through, lower it
    # if a real but small/distant moving object is being filtered out.
    min_moving_blob_points: 15

    # A blob's bounding-box longest side must NOT exceed this (meters) to
    # be published. Confirmed live that during CONTINUOUS forward driving
    # (not just startup/stationary jitter), a wall segment newly revealed
    # by the vehicle driving far enough to see around whatever was
    # occluding it also reads as under-corroborated - coverage_count only
    # models search-radius distance, not actual line-of-sight/occlusion -
    # and such blobs are large (100s of points) AND spatially elongated,
    # unlike a compact real object (person, vehicle). Lower this if walls
    # are still slipping through; raise it if a real wide/long moving
    # obstacle (e.g. a long vehicle passing close and lengthwise) is
    # being filtered out.
    max_moving_blob_extent_m: 2.5

    # Flat RGB tint (0-255 each) applied to every published moving point -
    # not intensity-mapped, so it reads as visually distinct in RViz
    # (PointCloud2 display, Color Transformer: RGB8) regardless of
    # whatever intensity data the original sensor points carried.
    moving_color_r: 0
    moving_color_g: 0
    moving_color_b: 255

    # /new_obstacle_points - every density+shape-filtered "new" point this
    # cycle, regardless of track confirmation (unlike /moving_obstacle_points,
    # confirmed movers only). costmap_lane_planner checks these against its
    # fixed-width lane band so a brand-new obstacle close to the lane can
    # never itself cause a lane change - only the ahead-zone stop gate reacts
    # to it, same "classification never reroutes" principle moving points
    # already get. Default tint is orange to match that node's own
    # "orange area" (lane_free_space_area) visualization.
    new_obstacle_color_r: 255
    new_obstacle_color_g: 165
    new_obstacle_color_b: 0

    process_rate_hz: 10.0

    # Per-object tracking (/moving_object_tracking: velocity arrow + speed
    # label + predicted-trajectory line per tracked object, Autoware-
    # style) - see this node's own "TRACKING" header comment for the two
    # failure modes an earlier, reverted attempt hit and how these guard
    # against them. ALSO gates /moving_obstacle_points itself now (see
    # CONFIRMATION below) - no longer informational-only.
    #
    # A detected object beyond this of every existing track's last known
    # position spawns a NEW track rather than updating one.
    max_track_jump_m: 2.0
    # Consecutive cycles a track can go unmatched before being dropped.
    max_missed_cycles: 5
    # How far ahead (seconds) the predicted-trajectory line extends.
    prediction_horizon_sec: 2.0

    # CONFIRMATION - vehicles/pedestrians only, not shaking tree leaves,
    # wind-blown debris, or sensor jitter. The density+shape filtering
    # above only proves a blob is new/transient; something jittering in
    # place passes that just as well as something translating does, from
    # one cycle's density alone. Sustained net displacement over several
    # cycles is what actually tells them apart - in-place jitter
    # oscillates back toward its own origin and never accumulates
    # distance, no matter how long it keeps triggering the density check.
    # A track only counts as a confirmed real mover (and only then does
    # its blob get published on /moving_obstacle_points, rather than
    # /static_obstacle_points) once matched for min_confirm_cycles
    # consecutive cycles AND its straight-line distance from where it was
    # FIRST seen exceeds min_confirm_displacement_m. Defaults confirm a
    # walking pedestrian (~1 m/s) in well under half a second.
    min_confirm_cycles: 3
    min_confirm_displacement_m: 0.3
