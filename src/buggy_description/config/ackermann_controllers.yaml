controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 2.0
    front_steering: true
    open_loop: false
    velocity_rolling_window_size: 10
    position_feedback: false
    use_stamped_vel: false

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true

    # Rear = traction (velocity-commanded drive wheels), front = steering
    # (position-commanded knuckles). Matches the URDF's ros2_control block
    # in buggy.ros2_control.xacro.
    rear_wheels_names: ["rear_left_wheel_joint", "rear_right_wheel_joint"]
    front_wheels_names: ["front_left_steer_joint", "front_right_steer_joint"]
    rear_wheels_state_names: ["rear_left_wheel_joint", "rear_right_wheel_joint"]
    front_wheels_state_names: ["front_left_steer_joint", "front_right_steer_joint"]

    # Dimensions from buggy_description/urdf/buggy.urdf.xacro - keep in sync
    wheelbase: 1.6
    front_wheel_track: 1.10
    rear_wheel_track: 1.10
    front_wheels_radius: 0.23
    rear_wheels_radius: 0.23
